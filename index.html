<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1000 Companies</title>
<style>
:root{--bg:#f6f5f1;--fg:#1a1a1a;--mut:#777;--card:#fff;--bd:#e2e0d8;--ac:#d9480f}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f0eee8;--mut:#9a9a9a;--card:#1d1d1d;--bd:#333;--ac:#ff7a45}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
nav{display:flex;gap:18px;padding:14px 24px;border-bottom:1px solid var(--bd)}
nav a{color:var(--mut);text-decoration:none;font-weight:600}nav a.on{color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:24px}
.big{font-size:clamp(100px,26vw,260px);font-weight:900;line-height:1;text-align:center;color:var(--ac);letter-spacing:-.04em;margin:10px 0 0}
.sub{text-align:center;color:var(--mut);text-transform:uppercase;letter-spacing:.15em;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;margin:22px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.stats{display:flex;justify-content:center;gap:40px;margin-bottom:24px;text-align:center}.stats b{display:block;font-size:32px}.stats span{color:var(--mut);font-size:13px}
textarea,input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:150px;font-family:ui-monospace,monospace;font-size:14px}
button{padding:14px 22px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:700 16px inherit;cursor:pointer}
button.g{background:none;border:1px solid var(--bd);color:var(--fg);font-weight:500;padding:8px 14px;font-size:14px}
.hint{color:var(--mut);font-size:13px;margin:8px 0 14px}.msg{margin-top:12px;font-weight:600;min-height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.row>*{flex:1;min-width:140px}
.item{display:block;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin-bottom:10px;text-decoration:none;color:inherit}
.item:hover{border-color:var(--ac)}.item h3{margin:0}.item small{color:var(--mut)}
.tag{display:inline-block;background:var(--bd);border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
table{width:100%;border-collapse:collapse}td{padding:10px 6px;border-bottom:1px solid var(--bd);vertical-align:top;word-break:break-word}td:first-child{color:var(--mut);width:30%;text-transform:capitalize}
</style></head><body>
<nav><a href="#/" id="n1">Countdown</a><a href="#/applications" id="n2">Applications</a></nav>
<main id="app"></main>
<script>
const TOTAL=1000,K='companyCountdownApps';
let apps=[];
const load=async()=>{try{const r=await fetch('/api/apps');apps=await r.json()}catch(e){}};
const save=()=>fetch('/api/apps',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(apps)}).catch(()=>alert('Save failed - is the server running?'));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cn=a=>(a.data.company||'').trim().toLowerCase();
const companies=()=>new Set(apps.map(cn).filter(Boolean));
const jobs=a=>(a.data.role||'').split('|').filter(x=>x.trim()).length||1;
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});

function parse(line){const d={};line.split(';').forEach(p=>{const i=p.indexOf(':');if(i<1)return;
 const k=p.slice(0,i).trim().toLowerCase(),v=p.slice(i+1).trim();if(k&&v)d[k]=v});return d}

function home(){
 const left=TOTAL-companies().size,totalJobs=apps.reduce((n,a)=>n+jobs(a),0);
 $('#app').innerHTML=`<p class="sub">Companies left to apply to</p><div class="big">${Math.max(left,0)}</div>
 <div class="bar"><i style="width:${(TOTAL-left)/TOTAL*100}%"></i></div>
 <div class="stats"><div><b>${companies().size}</b><span>companies applied</span></div><div><b>${totalJobs}</b><span>total jobs applied</span></div></div>
 <textarea id="t" placeholder="company: Google; role: SWE | Data Analyst; location: Remote; link: https://...; salary: 120k"></textarea>
 <p class="hint">Format: <code>key: value; key: value</code>. <b>company</b> is required. Put several roles at one company in <b>role</b> separated by <code>|</code> (each counts as a job). One application per line — paste many lines to register in bulk. A company only reduces the countdown the first time it appears.</p>
 <button id="go">Register application</button><div class="msg" id="m"></div>`;
 $('#go').onclick=async()=>{await load();const lines=$('#t').value.split('\n').map(s=>s.trim()).filter(Boolean);let added=0,newC=0,bad=0;
  const seen=companies();
  lines.forEach((l,i)=>{const d=parse(l);if(!d.company){bad++;return}
   if(!seen.has(d.company.toLowerCase())){seen.add(d.company.toLowerCase());newC++}
   apps.push({id:Date.now().toString(36)+i,ts:Date.now()+i,data:d});added++});
  await save();home();
  $('#m').textContent=`${added} registered, ${newC} new compan${newC==1?'y':'ies'}`+(bad?` — ${bad} line(s) skipped (no company)`:'');
 };
}

let q='',sort='new',from='',to='';
function match(a,terms){const hay=Object.entries(a.data).map(([k,v])=>k+':'+v).join(' | ').toLowerCase()+' '+fmt(a.ts).toLowerCase();
 return terms.every(t=>{const i=t.indexOf(':');
  if(i>0){const k=t.slice(0,i),v=t.slice(i+1);return Object.entries(a.data).some(([dk,dv])=>dk.includes(k)&&dv.toLowerCase().includes(v))}
  return hay.includes(t)})}
function list(){
 $('#app').innerHTML=`<div class="row"><input id="q" placeholder="Search anything — or use key:value (e.g. location:remote salary:120k)" value="${esc(q)}" style="flex:3">
 <select id="s"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">Company A–Z</option><option value="za">Company Z–A</option></select></div>
 <div class="row"><label>From<input type="date" id="f" value="${from}"></label><label>To<input type="date" id="to" value="${to}"></label></div>
 <p class="hint" id="c"></p><div id="l"></div>`;
 $('#s').value=sort;
 const draw=()=>{q=$('#q').value;sort=$('#s').value;from=$('#f').value;to=$('#to').value;
  const terms=(q.toLowerCase().match(/(?:[^\s"]+|"[^"]*")+/g)||[]).map(t=>t.replace(/"/g,''));
  const f=from?new Date(from+'T00:00:00').getTime():0,t=to?new Date(to+'T23:59:59').getTime():Infinity;
  let r=apps.filter(a=>a.ts>=f&&a.ts<=t&&match(a,terms));
  const name=a=>(a.data.company||'').toLowerCase();
  r.sort({new:(a,b)=>b.ts-a.ts,old:(a,b)=>a.ts-b.ts,az:(a,b)=>name(a).localeCompare(name(b)),za:(a,b)=>name(b).localeCompare(name(a))}[sort]);
  $('#c').textContent=`${r.length} of ${apps.length} applications`;
  $('#l').innerHTML=r.map(a=>`<a class="item" href="#/app/${a.id}"><h3>${esc(a.data.company)} <span style="color:var(--mut);font-weight:400">— ${esc(a.data.role||'role not given')}</span></h3><small>${fmt(a.ts)}</small></a>`).join('')||'<p class="hint">Nothing found.</p>'};
 ['q','s','f','to'].forEach(i=>$('#'+i).oninput=draw);draw();
}

function detail(id){
 const a=apps.find(x=>x.id===id);if(!a){$('#app').innerHTML='<p>Not found. <a href="#/applications">Back</a></p>';return}
 const rows=Object.entries(a.data).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${/^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v)}</td></tr>`).join('');
 $('#app').innerHTML=`<p><a href="#/applications">← All applications</a></p><h1 style="margin-bottom:4px">${esc(a.data.company)}</h1>
 <p class="hint">Registered ${fmt(a.ts)}</p>${(a.data.role||'').split('|').map(r=>`<span class="tag">${esc(r.trim())}</span>`).join('')}
 <table style="margin:18px 0">${rows}</table><button class="g" id="d">Delete this entry</button>`;
 $('#d').onclick=async()=>{if(confirm('Delete? The countdown will go back up if this was the only entry for the company.')){await load();apps=apps.filter(x=>x.id!==id);await save();location.hash='#/applications'}};
}

async function route(){await load();const h=location.hash||'#/';
 $('#n1').className=h==='#/'?'on':'';$('#n2').className=h!=='#/'?'on':'';
 if(h.startsWith('#/app/'))detail(h.slice(6));else if(h==='#/applications')list();else home();}
addEventListener('hashchange',route);route();
</script></body></html>
